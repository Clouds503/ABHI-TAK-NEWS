<!doctype html>
<html lang="hi">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#D40000" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Abhitak" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>Abhitak — सच, समय पर, सबसे पहले</title>
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Mukta:wght@400;500;600;700&family=Noto+Serif+Devanagari:wght@600;700;800&display=swap"
      rel="stylesheet"
    />
    <script>
      try {
        if (localStorage.getItem("abhitak.theme") === "dark")
          document.documentElement.classList.add("dark");
      } catch (e) {}
      window.addEventListener("DOMContentLoaded", function () {
        setTimeout(function () {
          var p = document.getElementById("app-preloader");
          if (p) p.style.display = "none";
        }, 1500);
      });
    </script>
  </head>
  <body>
    <div id="root">
      <div
        id="app-preloader"
        style="
          position: fixed;
          inset: 0;
          display: flex;
          flex-direction: column;
          align-items: center;
          justify-content: center;
          background-color: #ffffff;
          z-index: 99999;
          font-family:
            system-ui,
            -apple-system,
            sans-serif;
        "
      >
        <img
          src="/pwa-192.png"
          alt="Abhitak"
          style="
            width: 72px;
            height: 72px;
            object-fit: contain;
            border-radius: 14px;
            box-shadow: 0 6px 16px rgba(212, 0, 0, 0.12);
            animation: preloader-pulse 1.6s ease-in-out infinite;
          "
        />
        <div
          style="
            margin-top: 20px;
            width: 32px;
            height: 32px;
            border: 3px solid #f3f4f6;
            border-top-color: #d40000;
            border-radius: 50%;
            animation: preloader-spin 0.8s linear infinite;
          "
        ></div>
        <p
          style="
            margin-top: 14px;
            font-size: 15px;
            color: #333333;
            font-weight: 700;
            letter-spacing: 0.5px;
          "
        >
          अभी तक न्यूज़
        </p>
      </div>
      <style>
        @keyframes preloader-spin {
          to {
            transform: rotate(360deg);
          }
        }
        @keyframes preloader-pulse {
          0%,
          100% {
            transform: scale(1);
            opacity: 1;
          }
          50% {
            transform: scale(0.96);
            opacity: 0.85;
          }
        }
        @media (prefers-color-scheme: dark) {
          #app-preloader {
            background-color: #0b0f19 !important;
          }
          #app-preloader p {
            color: #f3f4f6 !important;
          }
        }
      </style>
    </div>
    <script type="module" src="/src/main.capacitor.tsx"></script>
  </body>
</html>
